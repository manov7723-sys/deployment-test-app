name: CD (deploy all services)

# Runs automatically after the CI workflow ("CI (build all services)") completes successfully.
# Also supports manual dispatch for redeploying without a fresh build.
on:
  workflow_run:
    workflows: ["CI (build all services)"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  deploy:
    name: Deploy all services
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no stored secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::400200465532:role/gha-manov7723-sys-deployment-test-app-deployment-test-app-result
          aws-region: us-east-1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure cluster access (keyless)
        run: aws eks update-kubeconfig --name "new-help-tes-2-dev" --region us-east-1

      - name: Ensure namespace storefront-dev is Active (auto-heal if stuck Terminating)
        # Three-stage self-heal — see cicd-pipeline.ts for the full rationale.
        # Stage 1: wait 60s for natural termination.
        # Stage 2: force-clear finalizers on Services + PVCs, wait 30s.
        # Stage 3: nuke the namespace's own finalizer via /finalize subresource.
        run: |
          set -eu
          NS="storefront-dev"
          ns_phase() { kubectl get namespace "$NS" -o jsonpath='{.status.phase}' 2>/dev/null || echo ""; }
          for i in $(seq 1 30); do
            p=$(ns_phase)
            { [ -z "$p" ] || [ "$p" = "Active" ]; } && break
            echo "namespace $NS is $p — waiting for natural termination ($i/30)"
            sleep 2
          done
          p=$(ns_phase)
          if [ "$p" = "Terminating" ]; then
            echo "::warning::Namespace $NS still Terminating after 60s — auto-clearing finalizers on Services and PVCs."
            for kind in svc pvc; do
              for res in $(kubectl get "$kind" -n "$NS" -o name 2>/dev/null); do
                echo "  clearing finalizers on $res"
                kubectl patch "$res" -n "$NS" -p '{"metadata":{"finalizers":null}}' --type=merge >/dev/null 2>&1 || true
              done
            done
            for i in $(seq 1 15); do
              p=$(ns_phase)
              { [ -z "$p" ] || [ "$p" = "Active" ]; } && break
              sleep 2
            done
          fi
          p=$(ns_phase)
          if [ "$p" = "Terminating" ]; then
            echo "::warning::Namespace $NS still Terminating — force-clearing its own finalizer via /finalize subresource."
            if command -v jq >/dev/null 2>&1; then
              kubectl get namespace "$NS" -o json | jq '.spec.finalizers = []' | kubectl replace --raw "/api/v1/namespaces/$NS/finalize" -f - >/dev/null 2>&1 || true
            else
              printf '%s' '{"apiVersion":"v1","kind":"Namespace","metadata":{"name":"'"$NS"'"},"spec":{"finalizers":[]}}' | kubectl replace --raw "/api/v1/namespaces/$NS/finalize" -f - >/dev/null 2>&1 || true
            fi
            sleep 3
          fi
          p=$(ns_phase)
          [ -z "$p" ] && kubectl create namespace "$NS"
          p=$(ns_phase)
          if [ "$p" != "Active" ]; then
            echo "::error::Namespace $NS auto-heal exhausted; still $p. Ask the agent to run unstick_terminating_namespace for deep diagnosis."
            exit 1
          fi
          echo "namespace $NS is Active — proceeding with apply."

      - name: Apply result manifests
        id: apply_result
        # Prefer manifest.yaml — deploy_my_app writes exactly that file, and
        # applying the whole dir picks up any stale *.yaml (e.g. a
        # hand-committed service.yaml from an older scaffold) that
        # alphabetically-sorts AFTER it and silently overrides the freshly
        # generated resource (2026-08 incident). Fall back to the dir for
        # repos whose manifests are still split across multiple files.
        run: |
          if [ -f "k8s/dev/result/manifest.yaml" ]; then
            kubectl apply -n storefront-dev -f "k8s/dev/result/manifest.yaml"
          else
            kubectl apply -n storefront-dev -f "k8s/dev/result/"
          fi

      - name: Restart result rollout (image tag "latest" — force pods onto the new build)
        id: restart_result
        run: kubectl rollout restart deployment/deployment-test-app-result -n storefront-dev

      - name: Wait for result rollout
        id: wait_result
        run: kubectl rollout status deployment/deployment-test-app-result -n storefront-dev --timeout=180s

      - name: Rollback result on failed rollout
        # Scoped to THIS service's own step outcomes (see sequentialDeploySteps
        # comment). `always()` lets the step evaluate even when the job status
        # is failure; the inner condition prevents rollback firing for a
        # service whose steps were skipped because an earlier service failed.
        if: ${{ always() && (steps.apply_result.outcome == 'failure' || steps.restart_result.outcome == 'failure' || steps.wait_result.outcome == 'failure') }}
        run: |
          echo "::warning::Rollout of deployment-test-app-result failed its health check — rolling back to the previous revision."
          kubectl rollout undo deployment/deployment-test-app-result -n storefront-dev
          kubectl rollout status deployment/deployment-test-app-result -n storefront-dev --timeout=120s

      - name: Apply vote manifests
        id: apply_vote
        # Prefer manifest.yaml — deploy_my_app writes exactly that file, and
        # applying the whole dir picks up any stale *.yaml (e.g. a
        # hand-committed service.yaml from an older scaffold) that
        # alphabetically-sorts AFTER it and silently overrides the freshly
        # generated resource (2026-08 incident). Fall back to the dir for
        # repos whose manifests are still split across multiple files.
        run: |
          if [ -f "k8s/dev/vote/manifest.yaml" ]; then
            kubectl apply -n storefront-dev -f "k8s/dev/vote/manifest.yaml"
          else
            kubectl apply -n storefront-dev -f "k8s/dev/vote/"
          fi

      - name: Restart vote rollout (image tag "latest" — force pods onto the new build)
        id: restart_vote
        run: kubectl rollout restart deployment/deployment-test-app-vote -n storefront-dev

      - name: Wait for vote rollout
        id: wait_vote
        run: kubectl rollout status deployment/deployment-test-app-vote -n storefront-dev --timeout=180s

      - name: Rollback vote on failed rollout
        # Scoped to THIS service's own step outcomes (see sequentialDeploySteps
        # comment). `always()` lets the step evaluate even when the job status
        # is failure; the inner condition prevents rollback firing for a
        # service whose steps were skipped because an earlier service failed.
        if: ${{ always() && (steps.apply_vote.outcome == 'failure' || steps.restart_vote.outcome == 'failure' || steps.wait_vote.outcome == 'failure') }}
        run: |
          echo "::warning::Rollout of deployment-test-app-vote failed its health check — rolling back to the previous revision."
          kubectl rollout undo deployment/deployment-test-app-vote -n storefront-dev
          kubectl rollout status deployment/deployment-test-app-vote -n storefront-dev --timeout=120s

      - name: Apply worker manifests
        id: apply_worker
        # Prefer manifest.yaml — deploy_my_app writes exactly that file, and
        # applying the whole dir picks up any stale *.yaml (e.g. a
        # hand-committed service.yaml from an older scaffold) that
        # alphabetically-sorts AFTER it and silently overrides the freshly
        # generated resource (2026-08 incident). Fall back to the dir for
        # repos whose manifests are still split across multiple files.
        run: |
          if [ -f "k8s/dev/worker/manifest.yaml" ]; then
            kubectl apply -n storefront-dev -f "k8s/dev/worker/manifest.yaml"
          else
            kubectl apply -n storefront-dev -f "k8s/dev/worker/"
          fi

      - name: Restart worker rollout (image tag "latest" — force pods onto the new build)
        id: restart_worker
        run: kubectl rollout restart deployment/deployment-test-app-worker -n storefront-dev

      - name: Wait for worker rollout
        id: wait_worker
        run: kubectl rollout status deployment/deployment-test-app-worker -n storefront-dev --timeout=180s

      - name: Rollback worker on failed rollout
        # Scoped to THIS service's own step outcomes (see sequentialDeploySteps
        # comment). `always()` lets the step evaluate even when the job status
        # is failure; the inner condition prevents rollback firing for a
        # service whose steps were skipped because an earlier service failed.
        if: ${{ always() && (steps.apply_worker.outcome == 'failure' || steps.restart_worker.outcome == 'failure' || steps.wait_worker.outcome == 'failure') }}
        run: |
          echo "::warning::Rollout of deployment-test-app-worker failed its health check — rolling back to the previous revision."
          kubectl rollout undo deployment/deployment-test-app-worker -n storefront-dev
          kubectl rollout status deployment/deployment-test-app-worker -n storefront-dev --timeout=120s
