name: CI (build all services)

# Manual trigger — click "Run" in the Actions tab (or the app's CI/CD Pipelines page).
# When this workflow succeeds, the CD workflow fires automatically via workflow_run.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  build-and-push:
    name: Build and push all services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no stored secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::400200465532:role/gha-manov7723-sys-deployment-test-app-deployment-test-app-result
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag result image
        env:
          ECR: 400200465532.dkr.ecr.us-east-1.amazonaws.com/deployment-test-app-result
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR:$TAG" -t "$ECR:latest" -f "result/Dockerfile" "result"

      - name: Scan result image for vulnerabilities (Trivy)
        continue-on-error: true
        env:
          ECR: 400200465532.dkr.ecr.us-east-1.amazonaws.com/deployment-test-app-result
          TAG: ${{ github.sha }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            "$ECR:$TAG" || echo "::warning::Trivy flagged issues or could not run — non-blocking, see logs."
      - name: Push result image
        env:
          ECR: 400200465532.dkr.ecr.us-east-1.amazonaws.com/deployment-test-app-result
          TAG: ${{ github.sha }}
        run: |
          docker push "$ECR:$TAG"
          docker push "$ECR:latest"

      - name: Build and tag vote image
        env:
          ECR: 400200465532.dkr.ecr.us-east-1.amazonaws.com/deployment-test-app-vote
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR:$TAG" -t "$ECR:latest" -f "vote/Dockerfile" "vote"

      - name: Scan vote image for vulnerabilities (Trivy)
        continue-on-error: true
        env:
          ECR: 400200465532.dkr.ecr.us-east-1.amazonaws.com/deployment-test-app-vote
          TAG: ${{ github.sha }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            "$ECR:$TAG" || echo "::warning::Trivy flagged issues or could not run — non-blocking, see logs."
      - name: Push vote image
        env:
          ECR: 400200465532.dkr.ecr.us-east-1.amazonaws.com/deployment-test-app-vote
          TAG: ${{ github.sha }}
        run: |
          docker push "$ECR:$TAG"
          docker push "$ECR:latest"

      - name: Build and tag worker image
        env:
          ECR: 400200465532.dkr.ecr.us-east-1.amazonaws.com/deployment-test-app-worker
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR:$TAG" -t "$ECR:latest" -f "worker/Dockerfile" "worker"

      - name: Scan worker image for vulnerabilities (Trivy)
        continue-on-error: true
        env:
          ECR: 400200465532.dkr.ecr.us-east-1.amazonaws.com/deployment-test-app-worker
          TAG: ${{ github.sha }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            "$ECR:$TAG" || echo "::warning::Trivy flagged issues or could not run — non-blocking, see logs."
      - name: Push worker image
        env:
          ECR: 400200465532.dkr.ecr.us-east-1.amazonaws.com/deployment-test-app-worker
          TAG: ${{ github.sha }}
        run: |
          docker push "$ECR:$TAG"
          docker push "$ECR:latest"
