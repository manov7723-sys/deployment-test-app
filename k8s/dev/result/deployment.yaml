apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-test-app-result
  namespace: storefront-dev
  labels:
    app.kubernetes.io/name: deployment-test-app-result
    app.kubernetes.io/managed-by: deepagent
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: deployment-test-app-result
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deployment-test-app-result
        app.kubernetes.io/managed-by: deepagent
    spec:
      containers:
        - name: deployment-test-app-result
          image: 400200465532.dkr.ecr.us-east-1.amazonaws.com/deployment-test-app-result:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 80
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 5
          envFrom:
            - secretRef:
                name: app-db
                optional: true
            - secretRef:
                name: app-env
                optional: true
            - secretRef:
                name: app-env-result
                optional: true
          env:
            - name: SESSION_COOKIE_SECURE
              value: "false"
            - name: VOTE_URL
              value: http://vote.storefront-dev.svc.cluster.local
            - name: WORKER_URL
              value: http://worker.storefront-dev.svc.cluster.local
