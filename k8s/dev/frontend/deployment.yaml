apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-test-app-frontend
  namespace: storefront-dev
  labels:
    app.kubernetes.io/name: deployment-test-app-frontend
    app.kubernetes.io/managed-by: deepagent
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: deployment-test-app-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deployment-test-app-frontend
        app.kubernetes.io/managed-by: deepagent
    spec:
      containers:
        - name: deployment-test-app-frontend
          image: 400200465532.dkr.ecr.us-east-1.amazonaws.com/deployment-test-app-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 5
          envFrom:
            - secretRef:
                name: app-db
                optional: true
            - secretRef:
                name: app-env
                optional: true
            - secretRef:
                name: app-env-frontend
                optional: true
          env:
            - name: SESSION_COOKIE_SECURE
              value: "false"
            - name: BACKEND_URL
              value: http://backend.storefront-dev.svc.cluster.local
