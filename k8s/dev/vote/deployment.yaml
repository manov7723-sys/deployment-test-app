apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-test-app-vote
  namespace: storefront-dev
  labels:
    app.kubernetes.io/name: deployment-test-app-vote
    app.kubernetes.io/managed-by: deepagent
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: deployment-test-app-vote
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deployment-test-app-vote
        app.kubernetes.io/managed-by: deepagent
    spec:
      containers:
        - name: deployment-test-app-vote
          image: 400200465532.dkr.ecr.us-east-1.amazonaws.com/deployment-test-app-vote:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
 
 
 
 
 
 
 
 
 
 
